version: '3.8'

services:
  signal-app:
    build: .
    container_name: signal_analytics_container
    restart: always
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3